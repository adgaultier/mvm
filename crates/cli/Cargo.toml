[package]
name = "mvm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mvm"
path = "src/main.rs"

[dependencies]
libc.workspace = true
mvm-api = { path = "../api" }
mvm-common = { path = "../common" }
mvm-manager = { path = "../manager" }
mvm-runtime = { path = "../runtime" }
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# VM-authenticated Agent API: a per-sandbox vsock channel the guest's
# `mvm-agent-mcp` bridge dials into (see `mvm_common::protocol::
# AGENT_API_VSOCK_PORT`). On by default; build with `--no-default-features`
# to compile mvm without the Agent API surface.
default = ["agent-api"]
agent-api = ["mvm-manager/agent-api"]
