[package]
name = "mvm-manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mvm-common = { path = "../common" }
mvm-image = { path = "../image" }
mvm-network = { path = "../network" }
mvm-runtime = { path = "../runtime" }
mvm-storage = { path = "../storage" }
bytes.workspace = true
chrono.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# VM-authenticated Agent API support: token *verification* (`authenticate_vm`/
# `authorize`). Token minting stays compiled regardless — it is part of the
# guest env channel. Enabled by default via the `mvm` binary.
agent-api = ["mvm-common/agent-api"]
