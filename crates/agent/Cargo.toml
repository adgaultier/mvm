[package]
name = "mvm-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mvm-agent"
path = "src/main.rs"

[dependencies]
mvm-common = { path = "../common" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
