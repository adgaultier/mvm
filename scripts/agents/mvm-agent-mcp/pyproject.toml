[project]
name = "mvm-agent-mcp"
version = "0.1.0"
description = "MCP bridge exposing the mvm Agent API to an agent running inside a microVM"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
mvm-agent-mcp = "mvm_agent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvm_agent_mcp"]
