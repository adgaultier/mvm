[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/api",
    "crates/cli",
    "crates/common",
    "crates/image",
    "crates/krun-sys",
    "crates/manager",
    "crates/network",
    "crates/runtime",
    "crates/storage",
    "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/mvm"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
ratatui = "0.29"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
